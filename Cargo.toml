[package]
name = "hastur-retouch"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A natural, non-destructive portrait retouching studio"
license = "MIT"

[features]
default = ["onnx"]
onnx = ["dep:ort", "dep:ndarray", "dep:burn", "dep:burn-store", "dep:burn-onnx"]

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui-wgpu = "0.33.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp"] }
rfd = "0.15"
glam = "0.32"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
crossbeam-channel = "0.5"
rayon = "1.11"
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
kamadak-exif = "0.6"
half = { version = "2", features = ["bytemuck"] }
moxcms = "0.8"
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "ndarray", "load-dynamic", "directml", "cuda", "coreml", "api-24"] }
ndarray = { version = "0.17", optional = true }
burn = { version = "=0.22.0-pre.4", default-features = false, features = ["std", "cpu", "store"], optional = true }
burn-store = { version = "=0.22.0-pre.4", default-features = false, features = ["std"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Graphics_Imaging", "Win32_System_Com", "Win32_Foundation"] }

[build-dependencies]
burn-onnx = { version = "=0.22.0-pre.4", default-features = false, features = ["import"], optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[[bin]]
name = "hastur-retouch"
path = "src/main.rs"
